# Follows the official OpenSSF Scorecard example. Scorecard verifies the workflow before it
# publishes results: no top-level env or defaults, no workflow-level write permissions, and only
# allow-listed actions in this job.
name: Scorecard

on:
  push:
    # Only the default branch is supported.
    branches: [main]
  schedule:
    # Weekly, on Saturdays.
    - cron: "30 1 * * 6"

# Read-only for the whole workflow, as in the official example.
permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard publishes results for public repositories only, and this job's token can't
    # check out a private one, so skip it until the repository is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write # OIDC token that publish_results needs
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the SARIF file as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
